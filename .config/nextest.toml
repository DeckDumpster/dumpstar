# cargo-nextest runs every test as its own process and schedules them across
# all test binaries at once, sized to the machine's vCPUs. `cargo test` runs
# binaries one after another (sp-7xm13h).
[profile.default]
fail-fast = false
# Flag a test as slow after 60 s and kill it after 5 minutes, so a hung test
# fails by name instead of consuming the gate.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
inherits = "default"
status-level = "slow"
final-status-level = "slow"
