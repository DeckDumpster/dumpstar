# Declares deploy/ci.sh's tiers to testenv (testenv/DESIGN.md §2.1.1), so
# `testenv --suites <tier> <branch> dumpstar` runs what CI runs for that tier.
# Tier names mirror DUMPSTAR_CI_ALL_TIERS in deploy/ci-select.sh; keep them in step
# (tests/ci/select_test.sh holds this file to that list). Each tier is
# `DUMPSTAR_CI_TIERS=<tier> bash deploy/ci.sh`, the explicit-list path, which runs
# exactly that tier with no floor added.
# The image is the builder base the Containerfile names. It stands in for CI's
# host runner: lint and rust need only a toolchain, bash and git. deploy, frontend
# and container need podman (and node, systemd) which this image does not carry,
# so they are declared — CI runs them — but only work where those are reachable;
# they are not in `default`.
# frontend-check is the exception that needs only node: the frontend's unit tests
# and svelte-check, which CI runs inside the frontend tier 35 minutes in. It is
# not a ci.sh tier (the name has a hyphen, so select_test.sh's canonical-tier
# check does not count it); it runs the same `npm ci && npm test && npm run
# check`, so a type error fails the member's local check, not remote CI. The
# image is the shared rust one with Node 22.21 fetched from nodejs.org (the tests
# import .ts directly, which needs 22.18+ type stripping), because a
# tier cannot name its own image (sp-os47b4); the build and the podman UI stay
# in the CI-only frontend tier.
image = "docker.io/library/rust:1.94-slim-bookworm"
workdir = "/work"
timeout = 1800
default = ["lint", "rust", "frontend-check", "ui"]

[tier.lint]
argv = ["bash", "-c", "apt-get update -qq && apt-get install -y -qq git curl jq sqlite3 python3 make >/dev/null && bash deploy/ci.sh"]
env = { DUMPSTAR_CI_TIERS = "lint", DUMPSTAR_RUNNER_DEPS_ONLY = "base rust" }
timeout = 900

[tier.rust]
argv = ["bash", "-c", "apt-get update -qq && apt-get install -y -qq git curl jq sqlite3 python3 make >/dev/null && cargo install --locked cargo-nextest --version 0.9.148 && bash deploy/ci.sh"]
env = { DUMPSTAR_CI_TIERS = "rust", DUMPSTAR_RUNNER_DEPS_ONLY = "base rust nextest" }
timeout = 1800

[tier.frontend-check]
argv = ["bash", "-c", "set -euo pipefail; apt-get update -qq && apt-get install -y -qq curl xz-utils ca-certificates >/dev/null; v=v22.21.1; curl -fsSL https://nodejs.org/dist/$v/node-$v-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1; cd frontend; npm ci; npm test; npm run check"]
timeout = 900

[tier.isolation]
argv = ["bash", "deploy/ci.sh"]
env = { DUMPSTAR_CI_TIERS = "isolation" }
timeout = 1800

[tier.deploy]
argv = ["bash", "deploy/ci.sh"]
env = { DUMPSTAR_CI_TIERS = "deploy" }
timeout = 900

[tier.frontend]
argv = ["bash", "deploy/ci.sh"]
env = { DUMPSTAR_CI_TIERS = "frontend" }
timeout = 900

# The ui tier: tests/ui/run.sh builds dumpstar and the frontend from the branch and
# runs every replay implementation in chromium. The rust image plus Node and
# playwright's chromium libraries (apt), because a tier cannot name its own image
# (sp-os47b4); a red here fails the member's local check.
[tier.ui]
argv = ["bash", "-c", "set -euo pipefail; apt-get update -qq && apt-get install -y -qq git curl jq sqlite3 python3 python3-cryptography python3-jwt make xz-utils ca-certificates >/dev/null; v=v22.21.1; curl -fsSL https://nodejs.org/dist/$v/node-$v-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1; bash tests/ui/run.sh"]
timeout = 2400

[tier.container]
argv = ["bash", "deploy/ci.sh"]
env = { DUMPSTAR_CI_TIERS = "container" }
timeout = 2400
