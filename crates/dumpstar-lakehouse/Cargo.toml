[package]
name = "dumpstar-lakehouse"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "dumpstar-lake-derive"
path = "src/main.rs"

[dependencies]
dumpstar-db.workspace = true
dumpstar-derive.workspace = true
dumpster-kit-lake.workspace = true
dumpster-kit-lakehouse.workspace = true
dumpstar-ingest.workspace = true
rusqlite.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true

[dev-dependencies]
dumpstar-swu.workspace = true
# row_identical.rs pulls in dumpstar-ingest/tests/support/mod.rs by path, which
# re-exports from dumpstar_ingest::test_upstream — that module is gated behind
# the test-support feature and is absent without it.
dumpstar-ingest = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
image.workspace = true
zstd.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tar.workspace = true
flate2.workspace = true
