[package]
name = "dumpstar-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dumpstar-core.workspace = true
dumpstar-db.workspace = true
dumpstar-cube.workspace = true
dumpster-kit-tenancy.workspace = true
dumpster-kit-oidc.workspace = true
dumpster-kit-mcp.workspace = true
dumpster-kit-mcp-auth.workspace = true
dumpster-kit-telemetry.workspace = true
rusqlite.workspace = true
axum.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true

[dev-dependencies]
dumpster-kit-tenancy = { workspace = true, features = ["testing"] }
dumpster-kit-conformance.workspace = true
dumpster-kit-oidc = { workspace = true, features = ["testing"] }
dumpstar-catalog.workspace = true
chrono.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# Decoders for the compression tests — the assertion that matters is that a
# compressed response decodes back to exactly the uncompressed bytes.
flate2.workspace = true
brotli.workspace = true
# RSA key generation and PEM export for the in-process JWKS test server.
rsa = { version = "0.9", features = ["pem"] }
# Base64url encoding for JWK construction.
base64 = "0.22"
url = "2"
