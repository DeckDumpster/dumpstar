start_page: /batches
involves:
  - "batches table on /batches with a Type link per row"
  - "batch detail header <h1> showing 'Spark of Rebellion binder page-through'"
  - ".sub metadata line showing the binder-click type, timestamp, and '7 cards'"
  - "card table rows with card-name links to /card/{set}/{number}"
fixture_data:
  batch: "Spark of Rebellion binder page-through — batch_type binder_click, 7 SOR copies"
notes: >
  1. Navigate to /batches. 2. Click the Type link for the
  "Spark of Rebellion binder page-through" row. 3. Wait for the batch detail page to
  load. 4. Verify the heading shows "Spark of Rebellion binder page-through".
  5. Verify the .sub metadata line shows a "7 cards" count.
  6. Verify the card table renders seven rows. 7. Verify a card-name
  cell is a link to a /card/{set}/{number} page.
