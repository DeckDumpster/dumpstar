start_page: /browse
involves:
  - "set tile a.tile with href '/browse/SOR' and title 'Spark of Rebellion'"
  - "binder browse page at /browse/[set] — frontend/src/routes/browse/[set]/+page.svelte"
  - "page heading h1 with the set name"
  - "a.statslink 'Set stats →'"
  - "div.stats with two div.stat blocks: 'Base {owned}/{total}' and 'Master {owned}/{total}', each with a div.bar"
  - "div.controls with sort buttons, Binder/Card view toggle, cards-per-row stepper; span.pageno"
  - "div.grid of button.slot elements"
fixture_data:
  set: "Spark of Rebellion (set_code SOR), 4 catalogued cards, no printed_total"
  collection: "7 SOR copies registered to Master Set: Spark of Rebellion via binder_click, so the Base and Master bars are partially filled"
notes: >
  1. Navigate to /browse. 2. Wait for the set grid; click the "Spark of Rebellion" tile.
  3. Wait for the /browse/SOR page and the h1 "Spark of Rebellion". 4. Assert the
  "Set stats →" link is visible. 5. Assert both progress bars (Base, Master)
  are visible. 6. Assert the controls bar (sort buttons, view toggle, cards-per-row stepper) and
  the "Page 1 of N" indicator are visible. 7. Assert at least one button.slot
  is rendered in the grid. 8. Screenshot.
