start_page: /browse/SOR
involves:
  - "VariantModal div.modal — the @media (max-width: 540px) rule makes it a bottom sheet (PLAN §6.9)"
  - "bottom-sheet styling: top auto, bottom 0, left 0, width 100%, transform none, border-radius 14px 14px 0 0, max-height 78vh"
fixture_data:
  set: "Spark of Rebellion (SOR)"
  card: "Luke Skywalker - Faithful Friend #5, Special"
  viewport: "set the browser viewport to a narrow width below 540px, e.g. 390x844"
notes: >
  1. Set the viewport to ~390px wide (below the 540px bottom-sheet
  breakpoint). 2. Navigate to /browse/SOR and wait for the slot grid.
  3. Click the Luke Skywalker - Faithful Friend #5 slot. 4. Wait for div.modal[role=dialog].
  5. Assert it is anchored to the bottom of the viewport — its bounding box
  bottom is flush with the viewport bottom and its width spans the full
  viewport width (bottom-sheet layout, not the centered dialog). 6. Assert
  the printing list is still visible. 7. Close via "×" or Escape; assert it
  hides. 8. Screenshot.
