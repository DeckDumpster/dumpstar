start_page: /browse/SOR
involves:
  - "addCopy() -> showToast() sets toast { message, copyId, printing }"
  - "div.toast (fixed bottom-center) with the message span and button.undo 'Undo'"
  - "message format 'Added {slot.name} · {variantLabel(variant)}'"
  - "undo() calls api.deleteCopy(copyId), decrements printing.owned_count, clears the toast"
  - "toastTimer auto-clears the toast after 6000ms; a new add resets the timer"
fixture_data:
  set: "Spark of Rebellion (SOR)"
  card: "Millennium Falcon - Piece of Junk #193, Rare — Normal printing starts at '7 owned' (every SOR printing is already owned)"
notes: >
  1. Navigate to /browse/SOR and wait for the slot grid. 2. Open the
  Millennium Falcon #193 modal and click "+ Add" on the Normal row. 3. Assert the count
  reads "8 owned" and a div.toast appears with text "Added Millennium Falcon -
  Piece of Junk · Normal" and an "Undo" button. 4. Click "Undo". 5. Assert the toast
  disappears and the count returns to "7 owned". 6. Screenshot. NOTE: do not
  rely on the 6s auto-dismiss in the test — exercise the explicit Undo path.
