start_page: /browse/SOR?cols=1
involves:
  - "span.pageno text 'Page {binder.page} of {binder.total_pages}'"
  - "button '← Prev' — disabled when binder.page <= 1"
  - "button 'Next →' — disabled when binder.page >= binder.total_pages"
  - "div.grid of button.slot — re-fetched by the load() $effect when pageNum changes"
fixture_data:
  set: "Spark of Rebellion (SOR), 4 catalogued cards; cols=1 gives 3 cards per page, so 2 pages (the default 3 columns would fit all 4 on one page)"
notes: >
  1. Navigate to /browse/SOR?cols=1 and wait for the slot grid. 2. Assert the
  page indicator reads "Page 1 of 2" and "← Prev" is disabled. 3. Click
  "Next →". 4. Wait for the indicator to read "Page 2 of 2" and a fresh slot
  grid to load; assert "← Prev" is now enabled. 5. Click "← Prev". 6. Assert
  the indicator returns to "Page 1 of 2" and "← Prev" is disabled. 7. Page 2
  holds the single Vanquish slot and "Next →" is disabled there. 8. Screenshot.
