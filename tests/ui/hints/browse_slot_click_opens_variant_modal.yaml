start_page: /browse/SOR
involves:
  - "button.slot onclick sets selectedSlot — renders VariantModal.svelte"
  - "div.modal[role=dialog] with header h3 '#{number} · {name}'"
  - "button.x (aria-label 'Close') and a.full 'Full card details →'"
  - "svelte:window onkeydown Escape calls onClose"
fixture_data:
  set: "Spark of Rebellion (SOR)"
  card: "Luke Skywalker - Faithful Friend #5, Special"
notes: >
  1. Navigate to /browse/SOR and wait for the slot grid. 2. Click the
  Luke Skywalker - Faithful Friend #5 slot button. 3. Wait for div.modal[role=dialog]; assert its
  heading reads "#5 · Luke Skywalker - Faithful Friend". 4. Assert the "Full card details →" link
  and the "×" close button are present. 5. Press Escape. 6. Assert the modal
  is hidden and the binder grid is shown again. 7. Screenshot.
