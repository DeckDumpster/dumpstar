start_page: /browse/SOR
involves:
  - "button.slot per card in div.grid"
  - "slot img (src = slot.image_large, loading='lazy') OR div.noart with the card name when image_large is null"
  - "div.foot with span.num (slot.number) and div.pips"
  - "div.pips contains one span.pip per non-deprecated printing"
fixture_data:
  set: "Spark of Rebellion (SOR)"
  cards: "Luke Skywalker - Faithful Friend #5 (Special — normal + holo printings), Millennium Falcon - Piece of Junk #193 (Rare — normal only)"
notes: >
  1. Navigate to /browse/SOR and wait for the slot grid. 2. Pick the first
  slot button. 3. Assert it contains either an img or a div.noart. 4. Assert
  its footer shows a span.num with the card number. 5. Assert div.pips holds
  at least one span.pip, with one pip per non-deprecated printing of that
  card. 6. Screenshot.
