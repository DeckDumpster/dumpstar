start_page: /browse/SOR
involves:
  - "VariantModal button.add '+ Add' calls onAdd(printing_id, variant)"
  - "addCopy() optimistically does printing.owned_count += 1, then POST /api/collection (source binder_click, batch_id sessionBatchId)"
  - "span.owned text updates to '{n} owned' and gains class 'has'; the slot pip fills"
  - "modal stays open after an add (selectedSlot unchanged)"
fixture_data:
  set: "Spark of Rebellion (SOR)"
  card: "Millennium Falcon - Piece of Junk #193, Rare — its only printing (Normal) has 7 owned copies in the fixture collection, so it starts at '7 owned'"
notes: >
  1. Navigate to /browse/SOR and wait for the slot grid. 2. Click the
  Millennium Falcon #193 slot. 3. In the modal, find the "Normal" printing row; assert
  it reads "7 owned". 4. Click its "+ Add". 5. Assert the row updates to
  "8 owned" (green) and the modal stays open. 6. Click "+ Add" again; assert
  "9 owned". 7. Screenshot. NOTE: each add hits /api/collection — conftest
  snapshots/restores collection.sqlite before each test, so the writes do not
  leak.
