start_page: /browse/SOR
involves:
  - "VariantModal ul with one li per printing in slot.printings"
  - "li > span.variant (variantLabel(p.variant)), span.owned '{count} owned' (class 'has' when count > 0), span.price '${market_price}', button.add '+ Add'"
  - "li.dim and button.add[disabled] for deprecated printings"
fixture_data:
  set: "Spark of Rebellion (SOR)"
  card: "Luke Skywalker - Faithful Friend #5, Special — printings: normal ($4.60) + holo/Foil ($24.00), each with a single market price observed 2024-01-15"
notes: >
  1. Navigate to /browse/SOR and wait for the slot grid. 2. Click the
  Luke Skywalker #5 slot. 3. Wait for the variant modal. 4. Assert the printing
  list has one li per printing (2 for Luke Skywalker #5). 5. Assert each li shows a
  variant label, an "{n} owned" span, a "$" price, and a "+ Add" button.
  6. Screenshot.
