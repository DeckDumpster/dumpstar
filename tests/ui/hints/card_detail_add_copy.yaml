start_page: /card/SOR/193
involves:
  - 'Printings table with a "+ Add" button per variant row'
  - 'clicking "+ Add" calls the add-copy mutation with source "manual"'
  - 'the page re-runs load() and the "Your copies" section shows the new copy'
  - 'the variant row Owned count increments'
fixture_data:
  card_name: "Millennium Falcon - Piece of Junk"
  variant: "normal"
notes: >
  SOR/193 (Millennium Falcon - Piece of Junk, Rare) carries a single "normal"
  variant and the fixture owns 7 copies of it. 1. Navigate to /card/SOR/193.
  2. Wait for the card detail to load. 3. Confirm the "Your copies (7)"
  header. 4. Click the "+ Add" button on the normal variant row. 5. After the
  non-optimistic reload, the header reads "Your copies (8)" and a new copy row
  appears in the copies table. 6. The normal variant's Owned count shows 8.
