start_page: /card/SOR/005
involves:
  - 'a copy row in the "Your copies" table with a Status <select>'
  - 'Status <select> options include owned, ordered, listed, sold, removed, traded, gifted, lost'
  - 'selecting "removed" calls changeStatus and triggers a reload'
  - 'the removed copy drops out of the owned-copy count'
fixture_data:
  card_name: "Luke Skywalker - Faithful Friend"
notes: >
  SOR/005 (Luke Skywalker - Faithful Friend, Special) has 8 copies; copy 24
  (holo, Near Mint) is the one loose, unassigned owned copy. Act on that
  copy (the one whose Location reads "Unassigned"). 1. Navigate to /card/SOR/005. 2. Wait for the copies table to
  load. 3. Note the "Your copies (N)" count. 4. Select "removed" from the
  copy's Status <select>. 5. After the non-optimistic reload, the copy is
  no longer shown as an owned copy.
