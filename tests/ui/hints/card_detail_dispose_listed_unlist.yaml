start_page: /card/SOR/521
involves:
  - 'a copy row in the "Your copies" table with a Status <select>'
  - 'Status <select> includes the "listed" and "owned" options'
  - 'selecting "listed" then "owned" each calls changeStatus and reloads'
  - 'the Status cell reflects the chosen status after each reload'
fixture_data:
  card_name: "Millennium Falcon - Piece of Junk (Showcase)"
  listed_variant: "normal"
notes: >
  SOR/521 (Millennium Falcon - Piece of Junk (Showcase), Legendary) already has
  the normal copy SOR-521:Normal (copy 20, in Trade Binder) in the "listed" status in the fixture. 1. Navigate to
  /card/SOR/521. 2. Wait for the copies table to load. 3. Confirm that
  copy's Status <select> reads "listed". 4. Select "owned" from the Status
  <select>. 5. After the non-optimistic reload, the copy's Status <select>
  shows "owned" selected.
