start_page: /collection
involves:
  - "open the owned Wampa (SOR 085) card modal from a grid tile"
  - "Aspect link in the modal: a.facet[title='Find all Aggression cards']"
  - "lands on /collection?q=aspect:Aggression&all=1 via client-side nav (no reload)"
  - "an unowned Aggression card renders as .cardtile.missing"
fixture_data:
  start_card: Wampa
  aspect: Aggression
notes: >
  Wampa (SOR_085) is owned and shares the Aggression aspect with Aggression
  cards the fixture does NOT own. Open the Wampa tile's
  modal, click the Aggression link, then assert a .cardtile.missing appears
  WITHOUT reloading — proof the all=1 param took effect on the client-side
  nav. Before the fix only owned tiles showed (no .missing) until reload.
