start_page: /collection
involves:
  - "'Select' button toggles multi-select mode"
  - "per-row checkboxes in the table while in select mode"
  - "bulk-action bar appears once a row is checked"
  - "bulk 'Assign to deck…' <select> lists existing decks"
  - "after assignment the page re-fetches via refresh() and clears the selection"
fixture_data:
  card_name: "Vanquish"
  search_term: "Vanquish"
  target_deck: "Vader Aggro"
notes: >
  Navigate to /collection. Search for "Vanquish" (SOR #P01) to narrow
  the table. Click "Select" to enter multi-select mode. Check the
  Vanquish row's checkbox. In the bulk-action bar choose "Millennium Falcon
  Cunning" from the "Assign to deck…" <select>. The page re-fetches the
  collection and drops the selection; the copy is now in that deck.
