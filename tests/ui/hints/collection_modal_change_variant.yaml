start_page: /collection
involves:
  - "collection table Name link to /card/{set}/{number}"
  - "card detail 'Your copies' table with a Variant <select> per copy"
  - "changing the Variant <select> re-points the copy at a different variant"
  - "the mutation runs through withBusy() and re-runs load()"
fixture_data:
  card_name: "Luke Skywalker - Faithful Friend"
  search_term: "Luke Skywalker"
  card_route: /card/SOR/005
  from_variant: "normal"
  to_variant: "holo"
notes: >
  1. Navigate to /collection. 2. Search for "Luke Skywalker" to find the Spark
  of Rebellion Luke (SOR #5, with normal + holo variants; not the Hyperspace card).
  3. Click its Name link to open /card/SOR/005. 4. Wait for the "Your
  copies" table. 5. In a copy row change the Variant <select> from
  "normal" to "holo". 6. After the non-optimistic reload the
  copy row shows the new variant.
