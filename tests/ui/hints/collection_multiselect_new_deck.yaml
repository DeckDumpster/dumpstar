start_page: /collection
involves:
  - "'Select' button toggles multi-select mode"
  - "table header checkbox selects every currently-filtered row"
  - "per-row checkboxes for selecting individual copies"
  - "bulk 'Assign to deck…' <select> in the bulk-action bar"
  - "the assign <select> resets selectedIndex to 0 after use; page calls refresh()"
fixture_data:
  card_name: "Vanquish"
  search_term: "Vanquish"
  target_deck: "Vader Aggro"
notes: >
  Navigate to /collection. Search for "Vanquish" (SOR-P01) to narrow the
  table. Click "Select" to enter multi-select mode. Check the first Vanquish
  row. In the bulk-action bar choose "Vader Aggro" from the "Assign
  to deck…" <select>. After the assignment the page re-fetches, the
  selection clears, and the assign <select> reads as a placeholder
  again.
