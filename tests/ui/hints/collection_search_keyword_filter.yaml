start_page: /collection
involves:
  - "search input [data-testid=search-input]"
  - "view toggle [data-testid=view-table] for text-based assertions"
  - "table rows showing card names (.cardname)"
fixture_data:
  query: "aspect:Aggression"
  present_card: "Wampa"
  absent_card: "Battlefield Marine"
notes: >
  Navigate to /collection (loads owned cards). Switch to table view via
  [data-testid=view-table]. Type "aspect:Aggression" into [data-testid=search-input]
  (debounced ~200ms). The table updates server-side to Aggression cards
  such as Wampa and excludes cards like Battlefield Marine.
