start_page: /collection
involves:
  - "'Select' button toggles multi-select mode"
  - "per-row checkboxes in the table"
  - "bulk-action bar with an 'Add to wishlist' button"
  - "bulk wishlist deduplicates by card_id — one wish per distinct card"
  - "page re-fetches via refresh() and clears the selection afterward"
fixture_data:
  search_term: "Vanquish"
  card_name: "Vanquish"
  copies: 3
notes: >
  Navigate to /collection. Search for "Vanquish" — three Vanquish
  copies exist, so three rows appear. Click
  "Select" to enter multi-select mode. Check two of the Vanquish rows.
  Click the bulk "Add to wishlist" button. Because wishlist adds
  deduplicate by card_id, only one Vanquish wish is created. The page
  re-fetches and the selection clears.
