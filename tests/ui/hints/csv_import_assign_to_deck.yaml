start_page: /ingest/csv
involves:
  - "Format select (TCGplayer / Dumpstar / Collectr)"
  - "…or paste CSV text textarea"
  - "Preview button"
  - "Import button (label reflects matched count)"
  - "result banner with added/skipped counts and 'View batch →' link"
  - "batch detail page at /batches/{batch_id}"
fixture_data:
  format: "TCGplayer"
  csv: "a TCGplayer export with rows resolving to fixture cards"
notes: >
  Navigate to /ingest/csv. Select "TCGplayer" in the Format select. Paste a
  valid TCGplayer CSV into the textarea. Click "Preview" and wait for the
  Matched rows table. Click "Import". Wait for the result banner. Click the
  "View batch →" link and verify it navigates to /batches/{batch_id} listing
  the imported cards.
