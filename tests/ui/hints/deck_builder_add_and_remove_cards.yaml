start_page: /decks/2
involves:
  - '"+ Add cards" button in the deck detail .actions group'
  - CollectionPicker modal with a search box and checkbox result rows
  - 'search box placeholder "Search your collection…"'
  - '"Add {n} to {deck name}" footer button confirms the selection'
  - each row has a "Remove" link button that un-assigns the copy
fixture_data:
  deck_id: 2
  deck_name: "Vader Aggro"
  searchable_card: "Millennium Falcon"
notes: >
  1. Navigate to /decks/2 (Vader Aggro). 2. Click "+ Add cards".
  3. Wait for the picker modal. 4. Search for "Millennium Falcon". 5. Check the
  Millennium Falcon - Piece of Junk copy row and click "Add 1 to Vader Aggro". 6. Verify
  Millennium Falcon - Piece of Junk appears in the deck card table and the card count increased.
  7. Click "Remove" on the Millennium Falcon - Piece of Junk row. 8. Verify the count returns to
  its original value and Millennium Falcon - Piece of Junk is gone. Take a screenshot.
