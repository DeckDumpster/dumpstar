start_page: /decks/2
involves:
  - '"+ Add cards" button opens the CollectionPicker modal'
  - 'picker search box with placeholder "Search your collection…"'
  - picker shows individual copy rows — one row per physical card, no qty aggregation
  - checking a row toggles its selection
  - '"Add {n} to Vader Aggro" footer button assigns the selected copy'
  - deck card table updates with the added card
fixture_data:
