start_page: /recent
involves:
  - "expanded card list ul.cards"
  - "card name link inside a card row -> /card/{set}/{number}"
fixture_data:
  batch: "Spark of Rebellion binder page-through (binder_click) — 7 SOR cards"
notes: >
  1. Navigate to /recent. 2. Wait for ul.timeline. 3. Click the "Spark of Rebellion binder page-through" batch row to expand it. 4. Wait for ul.cards.
