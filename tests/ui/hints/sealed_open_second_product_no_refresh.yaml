start_page: /sealed
involves:
  - '"+ Add sealed" button'
  - "add modal search sub-state with a text input"
  - "result list and confirm sub-state"
  - "closing the modal after the first add and reopening for a second product"
fixture_data:
  first_search: "Booster Display"
  first_product_name: "Spark of Rebellion Booster Display"
  second_search: "Prerelease Kit"
  second_product_name: "Spark of Rebellion Prerelease Kit"
notes: >
  This tests that the add modal resets cleanly between uses: after a
  successful add the modal closes and all of its fields reset, so the
  next open starts fresh in search mode.

  1. Navigate to /sealed. 2. Click "+ Add sealed" to open the modal.
  3. Type "Booster Display" into the search input. 4. Wait for results.
  5. Click the "Spark of Rebellion Booster Display" result to reach the confirm
  sub-state. 6. Click "Add to collection". 7. Wait for the modal to
  close and the table to reload. 8. Click "+ Add sealed" again.
  9. Assert the modal reopens in the search sub-state with an empty
  search input and no stale results — this is the regression check.
  10. Type "Prerelease Kit" and wait for results. 11. Click the
  "Spark of Rebellion Prerelease Kit" result to confirm the full flow still works.
