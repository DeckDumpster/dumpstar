start_page: /browse/SOR/stats
involves:
  - "Completion card 'Numbered set' bar (owned_cards / total_cards)"
  - "Completion card 'Master set' bar (owned_variants / total_variants)"
fixture_data:
  set: "SOR"
  detail: >
    Millennium Falcon and Vanquish carry one 'normal' variant; both Luke Skywalker cards carry 'normal' + 'holo', so the variant total (6) exceeds the card total (4).
notes: >
  1. Navigate to /browse/SOR/stats. 2. Wait for the analytics to
  load. 3. Read the total from the "Numbered set" bar (cards) and the
  total from the "Master set" bar (variants). 4. Verify the master-set
  variant total is strictly greater than the numbered-set card total,
  since the two Luke Skywalker cards each contribute two variants.
