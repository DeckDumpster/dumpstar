start_page: /browse/SOR/stats
involves:
  - "h1 set name 'Spark of Rebellion' with series 'Star Wars: Unlimited' below"
  - "'Binder view →' link -> /browse/SOR"
  - "Completion card with 'Numbered set' and 'Master set' progress bars"
  - "Value card with 'Owned', 'Full set', 'of set value' figures"
  - "'Rarity split' h2 and table"
fixture_data:
  set: "SOR"
  set_name: "Spark of Rebellion"
  series: "Star Wars: Unlimited"
notes: >
  1. Navigate to /browse/SOR/stats. 2. Wait for the analytics to
  load (no more "Loading…"). 3. Verify the h1 reads "Spark of Rebellion" and the
  series "Star Wars: Unlimited" is shown below it. 4. Verify the "Binder
  view →" link is present. 5. Verify the Completion card, the Value
  card, and the "Rarity split" table all render. 6. Verify there are no
  inputs or buttons (read-only page).
