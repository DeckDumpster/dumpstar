start_page: /browse/SOR/stats
involves:
  - "h1 set name (reactive to the set route param)"
  - "$effect that re-fetches analytics when the set param changes"
  - "Completion card and 'Rarity split' table"
fixture_data:
  set_a: "SOR"
  set_a_name: "Spark of Rebellion"
  set_b: "SHD"
  set_b_name: "Shadows of the Galaxy"
notes: >
  1. Navigate to /browse/SOR/stats. 2. Wait for the analytics to
  load and verify the h1 reads "Spark of Rebellion". 3. Navigate to /browse/SHD/stats.
  4. Wait for the analytics to reload. 5. Verify the h1 now reads "Shadows of the Galaxy" and the Completion card and Rarity split table have
  updated to the new set.
