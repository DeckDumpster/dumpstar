start_page: /browse/SOR/stats
involves:
  - "Completion card 'Numbered set' bar (owned_cards / total_cards)"
  - "Completion card 'Master set' bar (owned_variants / total_variants)"
  - "each bar shows '{owned} / {total} · {pct}%'"
  - "Value card 'Owned', 'Full set', 'of set value' figures"
fixture_data:
  set: "SOR"
  owned_cards: "4 of 4 SOR cards owned, 6 of 6 printings (the Spark of Rebellion binder page-through and the other batches)"
notes: >
  1. Navigate to /browse/SOR/stats. 2. Wait for the analytics to
  load. 3. Verify the "Numbered set" progress bar shows a
  "{owned} / {total} · {pct}%" string with a nonzero owned count.
  4. Verify the "Master set" bar likewise. 5. Verify the Value card
  shows "Owned", "Full set", and "of set value" figures, with "Owned"
  reflecting the value of the owned SOR copies.
