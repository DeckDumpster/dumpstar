# Scenario: Adding a copy shows an undo toast that reverses the add
# Use case: UC-browse-14

# Related: browse_variant_modal_add_increments_count, browse_session_creates_batch

description: >
  On the "Spark of Rebellion" binder browse page I open the variant modal for
  Millennium Falcon - Piece of Junk #193 and click "+ Add" on the "Normal" printing. The count
  optimistically jumps from "7 owned" to "8 owned" and a toast appears
  bottom-center reading "Added Millennium Falcon - Piece of Junk · Normal" with an "Undo" button. I click "Undo"; the just-added copy is
  deleted, the count drops back to "7 owned" and the toast disappears. If I do not click Undo, the toast clears itself after a
  few seconds.
