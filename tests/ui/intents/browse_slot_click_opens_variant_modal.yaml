# Scenario: Clicking a slot body opens the variant modal for that card

# Related: browse_variant_modal_lists_all_variants, browse_slot_renders_image_number_pips

description: >
  On the "Spark of Rebellion" binder browse page I click the body of the Luke Skywalker - Faithful Friend #5 slot.
  The variant modal opens, titled "#5 · Luke Skywalker - Faithful Friend", listing every printing of
  that card. The modal has a close "×" button and a "Full card details →"
  link. I press the Escape key and the modal closes, returning me to the
  binder grid.
