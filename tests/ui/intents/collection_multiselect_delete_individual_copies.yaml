# Scenario: Bulk-delete one specific copy when a card has several
#
# Prerequisites:
#   The fixture owns multiple copies of "Vanquish" (SOR-P01) — three
#   copies, two in binders and one built into a deck.

description: >
  When I open the Collection page and enter multi-select mode, a card I
  own more than once shows one row per physical copy because Dumpstar
  keeps strictly one row per card. I can check exactly one of the
  Vanquish rows, click the bulk "Delete" button, accept the confirm
  dialog, and only that one copy is removed. The other Vanquish copies
  remain in the collection after the re-fetch.
