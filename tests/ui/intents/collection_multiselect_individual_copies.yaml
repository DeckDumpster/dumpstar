# Scenario: Multi-select mode operates on individual copies
# Use case: UC-collection-18
#
# Prerequisites:
#   The fixture owns multiple copies of "Vanquish" (SOR-P01); each is
#   its own physical row because Dumpstar never aggregates quantity.

description: >
  When I enter multi-select mode on the Collection page, the table still
  shows one row per physical copy, so a card I own three times appears as three
  separate selectable rows. I can check just one Vanquish row and use
  the bulk "Assign to deck…" dropdown to move that single copy into a
  deck. The other Vanquish copies are left unchanged.
