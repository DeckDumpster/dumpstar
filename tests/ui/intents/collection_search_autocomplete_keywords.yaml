# Scenario: The search bar autocompletes keywords and is: flags
# Use case: UC-collection-22
#
# Related:
#   issues: [dumpstar-cx1]
#   pull_requests: []

description: >
  As I type in the Collection search bar, a dropdown suggests completions
  from the query vocabulary. Typing a bare token like "t" lists matching
  keywords (e.g. the rarity keyword) with their descriptions; typing
  "is:" lists the boolean flags I can use (is:graded, is:missing, …). The
  suggestions come from the server's keyword registry, not a hardcoded list.
