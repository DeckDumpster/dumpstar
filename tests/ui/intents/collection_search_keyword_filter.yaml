# Scenario: A keyword query filters the collection server-side
# Use case: UC-collection-28
#
# Related:
#   issues: [dumpstar-idf.10]
#   pull_requests: []

description: >
  On the Collection page I can type a Scryfall-style query like "aspect:Aggression"
  into the search bar. The list narrows to cards of that aspect —
  Wampa appears, while a Command card like Battlefield Marine does not. The
  filtering happens server-side via the query language, not a name
  substring match.
