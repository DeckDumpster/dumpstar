# Scenario: "All cards" surfaces unowned printings as dimmed tiles
# Use case: UC-collection-30
#
# Related:
#   issues: [dumpstar-idf.10]
#   pull_requests: []

description: >
  With the "All cards" toggle on, a query like "t:unit" returns both the
  Unit cards I own and the ones I'm missing. The unowned printings render
  as dimmed "missing" tiles alongside the owned ones, so I can see the gaps
  in my collection and click one to add it.
