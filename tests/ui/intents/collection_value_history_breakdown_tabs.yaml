# Scenario: The value chart breaks the collection down by set and by binder
#
# Related:
#   issues: [pd-0a30f178]
#   pull_requests: []
#
# Prerequisites:
#   The fixture collection spans two sets (Spark of Rebellion, Shadows of the Galaxy)
#   and three binders (Hyperspace Vault, Master Set: Spark of Rebellion, Trade Binder), and
#   `dumpstar seed-fixture` backfills a snapshot row for each.

description: >
  Inside the "Collection value over time" dialog I can switch from the
  single Total line to a "By set" or "By binder" breakdown, and the chart
  redraws with one line per set or per binder. This tells me which parts
  of my collection are carrying the value.
