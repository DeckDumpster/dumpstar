# Scenario: A Collectr export previews as separate cards / sealed / skipped panes
# Use case: UC-collectr-04
#
# Related:
#   issues: [dumpstar-0i9y]
#
# Prerequisites:
#   Fixture catalog contains Spark of Rebellion (Luke Skywalker - Faithful Friend #5
#   foil, Millennium Falcon - Piece of Junk #193 normal),
#   plus sealed products "Spark of Rebellion Two-Player Starter" and "Shadows of the Galaxy Booster
#   Pack". The pasted CSV also contains an unresolvable card, an unresolvable
#   sealed product, and a non-SWU (Lorcana) row.

description: >
  When I paste a Collectr export that mixes single cards, sealed products, and
  a other-game row and click Preview, the result is shown as three separate
  sections — Single cards, Sealed products, and Skipped — each reporting its
  own matched/unmatched counts. Cards and sealed never appear in the same
  table, and the Lorcana row is reported as skipped rather than silently
  dropped.
