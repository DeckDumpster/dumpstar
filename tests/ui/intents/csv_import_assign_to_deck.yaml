# Scenario: Import a CSV and view the created batch
# Use case: UC-csv-01
#
# Related:
#   issues: []

description: >
  After previewing a TCGplayer CSV on the CSV Import page, I click "Import" to
  commit. A result banner reports the added count and offers a "View batch →"
  link. I click the link and land on the created batch's detail page, which
  lists the imported cards.
