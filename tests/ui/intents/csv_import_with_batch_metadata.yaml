# Scenario: CSV Import page offers a TCGplayer format option
# Use case: UC-csv-09
#
# Related:
#   issues: []

description: >
  When I visit the CSV Import page, the Format select offers both TCGplayer and
  Dumpstar parsers. I switch the select to TCGplayer, paste a TCGplayer CSV,
  and click "Preview"; the resolution report classifies the rows as matched or
  unmatched using the TCGplayer parser.
