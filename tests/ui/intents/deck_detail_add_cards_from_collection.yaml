# Scenario: Add cards from collection to a deck
# Use case: UC-deck-09
#
# Prerequisites:
#   Deck 2 "Vader Aggro" exists. "Millennium Falcon - Piece of Junk" has an unassigned copy
#   in the collection.

description: >
  When I navigate to deck 2 (Vader Aggro) at /decks/2 and click
  "+ Add cards", the collection picker modal opens with a search field.
  I type "Millennium Falcon - Piece of Junk" in the search field, see Millennium Falcon - Piece of Junk in the results,
  check it to select it, and click the "Add" button. The modal closes
  and the card appears in the deck's card table. The card count
  increases.
