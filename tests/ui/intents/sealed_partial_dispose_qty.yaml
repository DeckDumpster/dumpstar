# Scenario: Mark a multi-quantity sealed entry as opened
# Use case: UC-sealed-12
#
# Related:
#   issues: []
#   pull_requests: []
#
# Prerequisites:
#   A sealed collection entry with quantity greater than 1.

description: >
  When I change the Status select on the Shadows of the Galaxy Booster Pack row
  (quantity 6) to "opened", the whole entry's status changes to "opened".
  With "Show opened / disposed" unchecked the row disappears from the
  active table; checking it brings the opened row back, dimmed.
