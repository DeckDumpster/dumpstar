# Scenario: A rarity row's owned count matches the collection
# Use case: UC-set-02
#
# Related:
#   pages: [set-stats]

description: >
  On the Set Stats page for Spark of Rebellion, the "Rarity split" table's Rare
  row shows an Owned count of 1 — the Millennium Falcon - Piece of Junk Rare is registered
  in the collection — out of a Total of 1. The Progress cell for that
  row reads 100%, proving owned/total counts are computed per rarity.
