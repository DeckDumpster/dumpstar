# Scenario: Set Stats reloads when the set route param changes
#
# Related:
#   pages: [set-stats]

description: >
  The Set Stats page re-fetches its analytics whenever the set route
  param changes. Loading /browse/SOR/stats shows the "Spark of Rebellion" dashboard;
  navigating to /browse/SHD/stats re-runs the analytics and the heading,
  Completion card, and Rarity split table all update to Shadows of the Galaxy.
